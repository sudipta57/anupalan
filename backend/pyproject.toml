[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anupalan-backend"
version = "0.1.0"
description = "Anupalan — compliance engine for packaged commodities in India (API + worker)"
requires-python = ">=3.12"
license = { text = "TODO-licence-not-yet-chosen" }

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "celery",
    "redis",
    "python-multipart",
    # Rule packs are YAML. uvicorn[standard] happens to pull PyYAML in today, but
    # services/rules/loader.py must not depend on another package's extras.
    "pyyaml",
    # Reporting (FR-27). python-docx is pure Python. WeasyPrint needs the GTK3 native stack
    # (pango, cairo, gdk-pixbuf) present on the host — see backend/README.md. Importing
    # services/reporting/pdf.py does NOT require it: the import is lazy inside render_pdf, so
    # HTML rendering and every other format work on a machine without those libraries.
    "python-docx",
    "weasyprint",
    # Object storage (B4). Speaks the S3 API; the provider is a config choice, not a code one.
    "boto3",
    # EXIF stripping (B4) and image handling. Declared explicitly rather than relied on as a
    # WeasyPrint transitive: services/storage.py must not depend on another package's tree.
    "pillow",
    # Vision (B5, B7). ArUco lives in contrib — the plain opencv-python wheel will not do.
    "opencv-contrib-python",
    "numpy",
    # Data layer (B12). The SQLAlchemy type for bis_chunks.embedding — vector(1024) — and the
    # operators B19's similarity search needs. Pure Python bindings; the extension itself lives
    # in Postgres and migration 0001 creates it. Declared with_variant in app/models/base.py, so
    # the same models build a working SQLite schema for the org-isolation suite, which CI runs
    # without any datastore.
    "pgvector",
    # Corpus fetching (scripts/fetch_bis.py). bis.gov.in pages are ~95% navigation, so a document
    # is only usable if the content region can be isolated from the menus — which needs a real HTML
    # parser, not a regex. Declared explicitly rather than relied on as a transitive, for the same
    # reason as pyyaml and pillow above. Not imported by `app/`: nothing the API or worker serves
    # depends on it.
    "beautifulsoup4",
]

# Auth (B13) deliberately adds NOTHING here. Access tokens are HS256 signed with stdlib hmac
# (app/services/auth/tokens.py, which documents the attacks that implementation has to close and
# is pinned by tests against each of them), and OTP codes and refresh tokens are peppered
# HMAC-SHA256 rather than a slow hash — six digits carries 10^6 of entropy, so single use, a short
# TTL and rate limiting are what protect a code, not the cost of hashing it.

[project.optional-dependencies]
# PaddleOCR is deliberately NOT a core dependency. It pulls paddlepaddle plus native wheels and
# downloads model weights on first run, which CI must never do. services/vision/ocr.py resolves
# engines lazily, so the pipeline imports, type-checks and tests without it — the stub adapter
# stands in (TRD FR-22 requires a second implementation anyway). Install this extra on a machine
# that actually runs OCR.
ocr = [
    # Pinned below 3.0 because the adapter is written against the 2.x API and 3.x renamed all of
    # it: `show_log` is gone, `use_angle_cls` became `use_textline_orientation`, and
    # `.ocr(img, cls=...)` became `.predict(..., return_word_box=True)` with a different result
    # shape. 3.x also defaults to PP-OCRv5, while CLAUDE.md §9 and docs/01-architecture.md §5 both
    # specify PP-OCRv4 — so upgrading is a model change, not just an API change, and belongs in a
    # work package that re-runs the E1 metrology evaluation rather than in a dependency bump.
    "paddleocr<3",
    "paddlepaddle",
]

# BIS retrieval (B19). One package carries both runtimes the corpus needs: BGE-M3 for the
# 1024-dimensional multilingual embeddings and bge-reranker-v2-m3 for the cross-encoder rerank.
# Kept out of the core dependencies for the same reason as [ocr] above — it pulls torch and
# downloads model weights on first use, which CI must never do. services/bis/embedding.py and
# services/bis/retrieve.py import it inside the adapter, so both modules import, type-check and
# test without it; the `hashing` and `overlap` stand-ins are selected by config in its absence.
bis = [
    "sentence-transformers",
]

dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "ANN",    # flake8-annotations — CLAUDE.md §5: annotate every public function
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "T20",    # flake8-print — no stray print() in services
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",
]
ignore = [
    "ANN401",  # Any is sometimes the honest annotation for **kwargs
    "B008",    # FastAPI's Depends()/File() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, which bandit flags, and need no annotation ceremony.
"tests/**/*.py" = ["S101", "ANN", "T20"]
# Alembic's generated env.py is framework boilerplate.
"alembic/env.py" = ["ANN", "T20"]
# The evaluation scripts (B22) are command-line tools whose printed output IS the deliverable —
# it is pasted into docs/eval-results.md. T20 exists to keep stray debugging out of services/,
# which is a different thing entirely.
"scripts/**/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
# Baseline for the whole backend. The strict gate below is scoped to app/services,
# because that is where a wrong millimetre is indistinguishable from a right one.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^\\.venv/", "^alembic/versions/", "^build/"]

[[tool.mypy.overrides]]
# CLAUDE.md §5: mypy --strict on app/services/.
module = "app.services.*"
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
warn_return_any = true
no_implicit_reexport = true

# ---------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:app.*"]
