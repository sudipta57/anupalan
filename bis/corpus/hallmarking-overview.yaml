  Gold Refinery

  Refineries already in the business of gold refining for the last one year and possessing accreditation
  from London Bullion Market Association (LBMA) or National Accreditation Board for Testing and Calibration
  Laboratories (NABL) accreditation of their laboratories may apply for obtaining BIS license for marking
  the Standard Bars produced by them in accordance with IS 1417: 2016 (for 995 and 999 fineness only).

