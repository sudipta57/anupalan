  Frequently Asked Questions

  1. What is Hallmarking?

  Hallmarking is the accurate determination and official recording of the proportionate content of precious
  metal in precious metal articles.

  2. What are the objectives behind instituting Hallmarking Scheme?

  To protect consumer against victimization due to irregular gold or silver quality, and to develop India
  as a leading gold market centre in the World and to develop export competitiveness.

