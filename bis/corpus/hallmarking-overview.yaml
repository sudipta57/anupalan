  1) Check testing of Hallmarked/Unhallmarked articles by Consumer:

  Consumer can get its jewellery/sample tested from any of the BIS Recognized Assaying & Hallmarking Centre.
  The Assaying and Hallmarking Centres undertake the testing of Jewellery/Samples of common consumers
  on priority on chargeable basis. The Assaying and Hallmarking centre is required to issue Assay Report
  giving proper identifications as marked on article.

