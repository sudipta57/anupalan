title: Hallmarking Overview
url: https://www.bis.gov.in/hallmarking-overview/?lang=en
text: 'Hallmarking overview

  Hallmarking is the accurate determination and official recording of the proportionate content of precious
  metal in precious metal articles. Hallmarks are thus official marks used in many countries as a guarantee
  of purity or fineness of precious metal articles. The principle objectives of the Hallmarking Scheme
  are to protect the public against adulteration and to obligate manufacturers to maintain legal standards
  of fineness. In India, at present two precious metals namely gold and silver have been brought under
  the purview of Hallmarking.

  Read More »

  Procedure For Obtaining Registration by Jeweller for Sale of Hallmarked Jeweller / Artefacrs

  Any jeweller willing to obtain certificate of registration for selling Hallmarked Gold and Silver Jewellery/artefacts
  shall apply online in the BIS portal;

  www.manakonline.in

  . The certificate of registration is granted instantly to the jeweller without the need to upload any
  document or pay any fees for the same. The certificate of registration stands valid for lifetime..

  Read More »

  Procedure for Recognition of Assaying and Hallmarking Center

  Indian Standard “IS 15820:2009 General Requirements for Establishment and Operation of Assaying and
  Hallmarking Centres” is the basis for recognition of Assaying and Hallmarking Centres. A centre desirous
  of obtaining recognition, after setting up of the Centre shall apply on the prescribed application form
  to BIS along with their Quality Manual, developed on the basis of Generic Quality Manual.

