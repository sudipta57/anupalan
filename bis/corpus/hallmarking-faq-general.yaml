title: Hallmarking FAQ - General
url: https://www.bis.gov.in/hallmarking-overview/hallmarking-faqs/hallmarking-faq/?lang=en
text: "General\nGeneral\n1.What is Hallmarking?\nHallmarking is the accurate determination and official\
  \ recording of the proportionate content of precious metal in precious metal articles (as per IS 15820).\
  \ Hallmarks are thus official marks used in India as a guarantee of purity or fineness of precious metal\
  \ articles.\n2.Which precious metals are hallmarked in India?\nIn India, at present two precious metals\
  \ namely gold and silver have been brought under the purview of Hallmarking.\n3.What are the Indian\
  \ Standards on Hallmarking?\nIS 1417: 2016 Gold and Gold Alloys, Jewellery/Artefacts-Fineness and Marking-\
  \ Specification\nIS 2112:2014 Silver and Silver Alloys, Jewellery/Artefacts-Fineness and Marking- Specification\n\
  IS 15820: 2009 General Requirements for establishment and operation of Assaying and operation of Assaying\
  \ and Hallmarking centres.\nIS 1418: 2009 Determination of gold in gold bullion, gold alloys and gold\
  \ jewellery/artefacts-cupellation( Fire Assay) Method\nIS 2113: 2014 Assaying Silver in Silver and Silver\
  \ Alloys-Methods.\nIS 17278:2019 Refined Gold and Silver Bars for Good Delivery — Specification\n4.What\
  \ are the grades permitted for hallmarking of Gold/Silver jewellery/Artefacts?\nIS 1417:2016 permits\
  \ hallmarking of six caratage (fineness in ppt) of gold jewellery/artefacts, viz. 14K(585), 18K(750),\
  \ 20K(833), 22K(916), 23K(958) and 24KS(995).\nIS 2112 : 2014 permits hallmarking of of six grades(fineness\
  \ in ppt) of silver jewellery/artefacts, viz. 800(800.0), 835(835.0), 900(900.0), 925(925.0), 970(970.0)\
  \ and 990(990.0)\n5.\tWhat are the objectives behind instituting Hallmarking Scheme?\nObjectives of\
  \ Hallmarking scheme are to protect consumer against malpractices in gold/silver related to purity,\
  \ to develop India as a leading gold market centre in the World and to develop export competitiveness.\n\
  6.\tWhat are the benefits to Customer from purchasing hallmarked jewellery?\nHallmarked jewellery provides\
  \ third party assurance and satisfaction that customer gets right purity of gold/silver for the given\
  \ price (value for money).\n7.\tHow will the jewellers benefit from getting registration/certification\
  \ from BIS ?\nIt will provide clear indication of his capability, strong evidence of commitment to quality\
  \ and assurance of consistency in purity and quality of gold/silver jewellery.\n8.\tWhat is HUID in\
  \ the hallmarked gold jewellery?\nHUID is a Hallmark Unique Identification (HUID) number and it is one\
  \ of the components of hallmark. It is a six-digit alphanumeric number which is unique for each hallmarked\
  \ item and is traceable. Customer can also verify the HUID number in the BIS Care App using the ‘Verify\
  \ HUID’ feature.\n9.\tWhat does hallmark on gold jewellery consist of?\nSince the introduction of HUID\
  \ (i.e. 1st July 2021) hallmark consists of 3 marks viz, BIS logo, purity of the article in caratage\
  \ as well as fineness and six-digit alphanumeric HUID number.\n10. Who operates the Hallmarking Scheme?\n\
  Reserve Bank of India (RBI) Standing Committee on Gold and Precious Metals, identified Bureau of Indian\
  \ Standards (BIS) in the year 2000 as the sole agency to operate the Hallmarking Scheme in India, and\
  \ entrusted BIS with the task of implementing hallmarking scheme to protect the consumer against malpractices\
  \ and develop export competitiveness and make India a leading market for gold jewellery in the world.\
  \ BIS through its network of Regional/ Branch offices all over the country operates the Hallmarking\
  \ Scheme for gold and silver jewellery.\n11.\tHow much does it cost to get a gold/silver article hallmarked?\n\
  i)\tFollowing hallmarking charges are applicable for gold articles:\n»   Rs. 45/- per article\n»   Minimum\
  \ charges for a consignment shall be Rs. 200/- (Services Tax and other levies as applicable shall be\
  \ extra)\nii)\tFollowing hallmarking charges are applicable for silver articles:\n»   Rs. 35/- per article\n\
  »   Minimum charges for a consignment shall be Rs. 150.00. (Services Tax and other levies as applicable\
  \ shall be extra)\nNote-\n•\tConsignment – A consignment shall be collection of articles/artifacts of\
  \ same fineness from which a sample shall be drawn and assayed to determine conformance with the acceptable\
  \ criteria. There may be different lots in a consignment.\n•\tLot – A lot shall be defined as set of\
  \ articles having same fineness, type/design\n12.\tDoes Hallmark charges include making charges and\
  \ wastage charges?\nNo.\n13.\tAre the hallmarking charges dependent on weight of jewellery?\nNo, hallmarking\
  \ charges are paid per article irrespective of the weight of the article.\n14.\tIs it necessary to take\
  \ authentic bills/invoice for the hallmarked article from retailer/jeweller?\nYes, it is necessary to\
  \ take authentic bills/invoice of the hallmarked article from retailer/jeweller.\n15.\tIs it necessary\
  \ to have details of hallmarked articles in the bill/invoice issued by jeweller/retailer?\nYes, it is\
  \ necessary to have details of hallmarked articles in the bill/invoice issued by jeweller/retailer for\
  \ any dispute/misuse/complaint redressal.\n16.\tWhat should be looked at in a jewellery shop while purchasing\
  \ the hallmarked jewellery?\nOn the outside of the sales outlet, the registered/certified jeweller shall\
  \ display the logo of BIS with the wording “Hallmarked jewellery available for sale”. Certificate of\
  \ registration issued by BIS shall be displayed by the jeweller in a jewellery shop. Jeweller shall\
  \ have magnifying glass of minimum 10X magnification to show hallmark to customer in the hallmarked\
  \ jewellery. Relation of fineness with caratage shall be displayed by the jeweller.\n17.\tWhat control\
  \ BIS has on registered/certified Jewellers and Recognized Assaying and Hallmarking Centres?\nBIS carries\
  \ out regular surveillance audit of Assaying and Hallmarking Centres as well as draws market samples\
  \ from registered/certified jewellers for testing in BIS referral assay labs (RALs).\n18.\tWhat are\
  \ the permissible sizes(height) of hallmark on gold/silver articles?\nThe permissible sizes (height)\
  \ of the hallmark are :\nFor Gold(mm)\nFor Silver(mm)\n1.5\n4.0\n1.0\n2.0\n0.75\n1.5\n0.5\n1.0\n–\n\
  0.75\n19.\tIs it necessary to have hallmark on both the articles/jewellery in pairs and on all detachable\
  \ parts?\nYes, each article in pair and all detachable parts should have hallmark with different HUIDs.\
  \ Customer should look for hallmarking and fineness details in each article to prevent any misuse w.r.t\
  \ fineness/purity.\n20.\tWhat is the detachable part in jewellery?\nDetachable part in jewellery is\
  \ any part which can be easily removed or replaced.\n21.\tCan an artisan or common man directly approach\
  \ the A&H centre for hallmarking of the jewellery?\nNo, only BIS registered/certified jewellers can\
  \ approach the A&H centre for hallmarking of the jewellery.\n22.\tWhere can a common person get information\
  \ on hallmarking?\nAll the information regarding hallmarking in detail has been provided at BIS website:\
  \  www.bis.gov.in under hallmarking section. The information includes general information on hallmarking,\
  \ hallmarking regulation, mandatory hallmarking orders, procedure and guidelines for Jewellers and hallmarking\
  \ centres, all the forms and list of registered jewellers as well as hallmarking centres etc.\n23.\t\
  Where can one  get the list of BIS Registered jewellers?\nThe list of BIS Registered/certified jewellers\
  \ is available on BIS website under hallmarking section and can be directly accessed by following the\
  \ link\nhttps://www.bis.gov.in/index.php/hallmarking-overview/jewellers-registration-scheme/list-of-licensed-jewellers//\n\
  24.\tWhere can one get the list of BIS Recognized Assaying and Hallmarking centres?\nThe list of BIS\
  \ Recognized Assaying and Hallmarking centres is available on BIS website under hallmarking section\
  \ and can be directly accessed by following the link:\nhttps://www.manakonline.in/MANAK/AHCListForWebsite\n\
  25.\tIs it possible for the common man to get his/her hallmarked jewellery tested for purity from an\
  \ A&H centre?\nYes, after paying testing charges of Rs. 200(for testing by fire assay method as per\
  \ IS 1418) to any of BIS recognized A&H centre. The list of BIS recognized A&H centre is available at\
  \ BIS website www.bis.gov.in under the hallmarking section."
