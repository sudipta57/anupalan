text: "About CRS\nMinistry of Electronics & Information Technology (MeitY) (erstwhile DeitY) has notified\n\
  \"Electronics and Information Technology Goods (Requirement for Compulsory Registration) Order, 2012\"\
  \non 03 October 2012 for fifteen categories of electronics items.\nFifteen more product categories\n\
  were added by MeitY under this order on 07 November 2014. MeitY has also notified Indian Standard for\
  \ \x91Indian Language Support for Mobile Phones\x92 on 24 October 2016.\nAnother thirteen product categories\n\
  were added by MeitY under this order on 17 August 2017.\nAnother twelve product categories\nwere added\
  \ by MeitY under this order on 01 April 2020.\nAnother seven product categories\nwere added by MeitY\
  \ under this order on 01 Oct 2020. MeitY has also notified Indian Standard for\n\x91Digital Television\
  \ Receiver for Satellite Broadcast Transmission \x96 Specification\x92\non 26 April 2023.\nMinistry\
  \ of New and Renewal Energy(MNRE) has notified five products under\nSolar Photovoltaics, Systems, Devices\
  \ and Components Goods (Requirements for Compulsory Registration) Order, 2017\ndated 30 August 2017.\n\
  Ministry of Chemicals and Fertilizers has notified one product under\nOrtho Phosphoric Acid (Quality\
  \ Control) Order, 2021\ndated 15 June 2021, one more product has been added under the\nPolyphosphoric\
  \ Acid (Quality Control) Order, 2021\ndated 24 December 2021.Further,one more product has been added\
  \ under\nTrimethyl Phosphite (Quality Control) Order, 2022\ndated 05 April 2022.\nMinistry of Textiles\
  \ has notified one product under\nCotton Bales (Quality Control) Order, 2023\ndated 28 February 2023.\n\
  As per the Orders, no person shall manufacture or store for sale, import, sell or distribute goods which\
  \ do not conform to the Indian standard specified in the order and do not bear the Standard Mark with\
  \ unique registration number obtained from BIS.\nBureau of Indian Standards grants licence to the manufacturers\
  \ to use or apply Standard Mark with unique R-number,through registration based on self-declaration\
  \ of conformity for goods and articles as per Indian Standards. The grant of licence and its operation\
  \ under Compulsory Registration Scheme are carried out as per the conformity assessment scheme under\n\
  Scheme - II of Schedule - II of BIS (Conformity Assessment) Regulations, 2018'\n.\nWho can apply for\
  \ CRS\nManufacturer (factory owner) of any product, which comes under the ambit of the Compulsory Registration\
  \ Order (CRO) notified by Ministry of Electronics and Information Technology (MeitY), Ministry of New\
  \ and Renewable Energy (MNRE),Ministry of Chemicals and Fertilizers and Ministry of Textiles.\nProducts\
  \ under CRS\nAmplifiers With Input Power 2000w And Above\nAutomatic Data Processing Machine\nAutomatic\
  \ Data Processing Machine\nElectronic Games (Video)\nElectronic Musical Systems With Input Power 200w\
  \ And Above....\nRead More »\n.\nStandard Mark and Labeling Guidelines\nClick here\nfor guidelines for\
  \ use of Standard Mark and labelling requirements \tunder BIS Compulsory Registration Scheme.\nNotifications\
  \ and Guidelines by BIS\nBIS is operating Compulsory Registration Scheme (CRS) as per Scheme - II of\
  \ Schedule - II of BIS (Conformity Assessment) Regulations, 2018.\nClick here\nto refer BIS Act 2016,\
  \ BIS Rules 2018, BIS (Conformity Assessment) Regulations 2018 and various guidelines framed there under.\n\
  MeitY Notifications\nElectronics & Information Technology Goods (Requirements for Compulsory Registration)\
  \ Order, 2012 Dated 7th September 2012\nExpansion of list of items under Electronics & Information Technology\
  \ Goods (Requirements for Compulsory Registration) Order, 2012 dated 13th November 2014....\nRead More\
  \ »\nMNRE Notifications\nMinistry of New and Renewal Energy(MNRE) has notified 6 products through notification\
  \ dated 05 September 2017.\nRevised schedule and enforcement date of Solar Photovoltaic Systems/Devices/Components\
  \ Goods Order 2017....\nRead More »"
