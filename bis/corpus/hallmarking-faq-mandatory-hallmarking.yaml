title: Hallmarking FAQ - Mandatory Hallmarking
url: https://www.bis.gov.in/hallmarking-overview/hallmarking-faqs/mandatory/?lang=en
text: "Consumers\nConsumers\n1.\tCan people sell their old jewellery to jewelers after Hallmarking becomes\
  \ mandatory?\nA)\tYes, Consumer can sell old un-hallmarked/hallmarked jewellery lying with them to the\
  \ jewellers.\n2.\tWhat is the provision of compensation to the consumer for any shortfall in purity\
  \ of hallmarked articles?\nAs per section 49 of BIS Rules, 2018, in case of precious metal article not\
  \ conforming to the relevant standards, such compensation to the buyer/customer shall be two times the\
  \ amount of difference calculated on the basis of shortage of purity for the weight of such article\
  \ sold and the testing charges.\n3.\tWhat is the process of complaint registration in BIS?\nBIS follows\
  \ a well-established complaint redressal procedure. Complaints are recorded centrally at Complaints\
  \ Management and Enforcement Department. Complaints can be made both offline and online. Online complaint\
  \ can be made through BIS mobile app BIS CARE or by use of online complaint registration portal on www.bis.gov.in\
  \ or by sending a mail to\ncomplaints@bis.gov.in\n. Personally contacting/writing to Public Grievance\
  \ officer of the nearest Regional/ Branch office of BIS or directly to the Head (Complaints Management\
  \ and Enforcement Department). On receipt of the complaint it is investigated and further actions taken\
  \ for its redressal.\n4.\tWho will decide the amount of compensation in cases of complaint of purity\
  \ of the hallmarked article being lesser than declared/marked purity?\nThe amount of compensation has\
  \ already been specified in sub-rule(1) of  Rule 49 of BIS Rules, 2018 which states “Provided that in\
  \ case of precious metal article not conforming to the relevant standards, such compensation shall be\
  \ two times the amount of difference calculated on the basis of shortage of purity for the weight of\
  \ such article sold and the testing charges”.\n5.\tWill the hallmark be valid for the entire life-time\
  \ of the hallmarked jewellery?\nYes, the hallmark will be valid for the entire life-time of the hallmarked\
  \ jewellery.\n6.\t     How will customer identify jeweller’s name from the HUID?\nCustomer can verify\
  \ the HUID number in the BIS Care App using the ‘Verify HUID’ feature and get the information related\
  \ to the jeweller’s registration no."
